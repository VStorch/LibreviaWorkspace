appId: com.librevia.suite
productName: Librevia
copyright: Uso interno

directories:
  output: release
  buildResources: build

# Só o que o aplicativo precisa para rodar. O código-fonte, os testes e o
# projeto .NET ficam de fora: eles não são executados no destino, e cada
# megabyte a mais é um megabyte que o instalador carrega por nada.
files:
  - out/**
  - package.json
  - '!**/*.map'

# As fontes vão junto do sidecar, e pelo mesmo motivo de estarem fora do asar:
# o Chromium as carrega por URL, e uma URL não alcança arquivo dentro de um
# pacote compactado. São 7,2 MB e não são enfeite — sem elas a quebra de linha
# muda e o documento pagina diferente na máquina de quem instala.
#
# O dicionário de português sai do asar pelo mesmo motivo prático: ele é copiado
# para o perfil do usuário na primeira execução, e copiar de dentro de um pacote
# compactado exigiria descompactá-lo. São 3,8 MB que compram ortografia sem rede.
#
# O sidecar não entra no asar: ele é um executável, e um executável dentro de
# um arquivo compactado não pode ser lançado. Cada plataforma leva só o seu
# binário — os 126 MB do outro não serviriam para nada no destino.
#
# O destino é `resources/sidecar/<rid>` **dentro** de `resources/`, porque é ali
# que `sidecarPathIn` procura a partir de `process.resourcesPath`.
linux:
  category: Office
  synopsis: Suíte de documentos e planilhas, offline
  # Sem isto o ambiente gráfico não liga a janela aberta ao ícone da barra de
  # tarefas, e o aplicativo aparece como uma entrada genérica sem nome. O nome
  # do arquivo `.desktop` vem do `package.json`, que é onde o builder o procura.
  syncDesktopName: true
  target:
    - AppImage
    - deb
  extraResources:
    - from: resources/sidecar/linux-x64
      to: resources/sidecar/linux-x64
      filter: ['!*.pdb']
    - from: resources/fonts
      to: resources/fonts
    # O dicionário de português. Viaja pela mesma razão das fontes — a máquina de
    # destino não tem nenhum — e é copiado para o perfil do usuário na primeira
    # execução, porque é lá que o corretor do Chromium o procura antes de tentar
    # baixá-lo. Ver src/main/spellcheck.ts.
    - from: resources/dictionaries
      to: resources/dictionaries
      filter: ['*.bdic']
    - THIRD-PARTY-NOTICES.md
  # Extensões que o aplicativo abre, para o gerenciador de arquivos oferecê-lo.
  mimeTypes:
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - text/plain

win:
  fileAssociations:
    - ext: docx
      name: Librevia Word Document
      description: Word document
      role: Editor
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: resources/sidecar/win-x64
      to: resources/sidecar/win-x64
      filter: ['!*.pdb']
    - from: resources/fonts
      to: resources/fonts
    # O dicionário de português. Viaja pela mesma razão das fontes — a máquina de
    # destino não tem nenhum — e é copiado para o perfil do usuário na primeira
    # execução, porque é lá que o corretor do Chromium o procura antes de tentar
    # baixá-lo. Ver src/main/spellcheck.ts.
    - from: resources/dictionaries
      to: resources/dictionaries
      filter: ['*.bdic']
    - THIRD-PARTY-NOTICES.md

nsis:
  # Instalação por usuário: em máquina corporativa nem todo mundo tem
  # administrador, e exigir elevação transformaria "instalar" em "abrir chamado".
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

deb:
  # Endereço `.internal` de propósito: é o TLD reservado para uso interno, e
  # dizer isso é mais honesto que inventar um domínio público que não existe.
  # Troque pelo endereço da empresa antes de distribuir de verdade.
  maintainer: Librevia <librevia@librevia.internal>
  # `libnotify` e companhia são as dependências habituais de um Electron em
  # Debian/Ubuntu; sem elas o pacote instala e o aplicativo não abre.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

# Nada de assinatura por enquanto: não há certificado, e assinar com um
# autoassinado dá mais aviso do que garantia.
publish: null
