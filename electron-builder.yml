appId: com.librevia.suite
productName: Librevia
copyright: Uso interno

directories:
  output: release
  buildResources: build

# Only what the app needs to run. Source, tests and the .NET project stay out: they do not run on
# the target, and every extra megabyte is one the installer carries for nothing.
files:
  - out/**
  - package.json
  - '!**/*.map'

# Fonts go along with the sidecar, outside the asar for the same reason: Chromium loads them by URL,
# and a URL cannot reach a file inside a packed archive. They are 7.2 MB and not decoration: without
# them line breaks change and the document paginates differently on the installer's machine.
#
# The Portuguese dictionary leaves the asar for the same practical reason: it is copied to the user
# profile on first run, and copying from inside a packed archive would require unpacking it. 3.8 MB
# that buy offline spelling.
#
# The sidecar does not go in the asar: it is an executable, and an executable inside a packed
# archive cannot be launched. Each platform carries only its own binary; the other one's 126 MB
# would be useless on the target.
#
# The destination is `resources/sidecar/<rid>` **inside** `resources/`, because that is where
# `sidecarPathIn` looks from `process.resourcesPath`.
linux:
  category: Office
  synopsis: Suíte de documentos e planilhas, offline
  # Without this the desktop does not link the open window to the taskbar icon, and the app shows as
  # a generic, nameless entry. The `.desktop` file name comes from `package.json`, which is where
  # the builder looks.
  syncDesktopName: true
  target:
    - AppImage
    - deb
  extraResources:
    - from: resources/sidecar/linux-x64
      to: resources/sidecar/linux-x64
      filter: ['!*.pdb']
    - from: resources/fonts
      to: resources/fonts
    # The Portuguese dictionary. It ships for the same reason as the fonts (the target machine has
    # none) and is copied to the user profile on first run, because that is where Chromium's
    # spellchecker looks before trying to download it. See src/main/spellcheck.ts.
    - from: resources/dictionaries
      to: resources/dictionaries
      filter: ['*.bdic']
    # The gallery templates; see src/main/ipc/templates.ts.
    - from: resources/templates
      to: resources/templates
      filter: ['*.dotx']
    - THIRD-PARTY-NOTICES.md
  # Extensions the app opens, so the file manager offers it.
  mimeTypes:
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.openxmlformats-officedocument.wordprocessingml.template
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - text/plain

win:
  fileAssociations:
    - ext: docx
      name: Librevia Word Document
      description: Word document
      role: Editor
    - ext: dotx
      name: Librevia Word Template
      description: Word template
      role: Editor
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: resources/sidecar/win-x64
      to: resources/sidecar/win-x64
      filter: ['!*.pdb']
    - from: resources/fonts
      to: resources/fonts
    # The Portuguese dictionary. It ships for the same reason as the fonts (the target machine has
    # none) and is copied to the user profile on first run, because that is where Chromium's
    # spellchecker looks before trying to download it. See src/main/spellcheck.ts.
    - from: resources/dictionaries
      to: resources/dictionaries
      filter: ['*.bdic']
    # The gallery templates; see src/main/ipc/templates.ts.
    - from: resources/templates
      to: resources/templates
      filter: ['*.dotx']
    - THIRD-PARTY-NOTICES.md

nsis:
  # Per-user install: on corporate machines not everyone is an administrator, and requiring
  # elevation would turn "install" into "open a ticket".
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

deb:
  # A `.internal` address on purpose: it is the TLD reserved for internal use, and saying so is more
  # honest than inventing a public domain that does not exist. Replace it with the company address
  # before distributing for real.
  maintainer: Librevia <librevia@librevia.internal>
  # `libnotify` and friends are an Electron app's usual dependencies on Debian/Ubuntu; without them
  # the package installs and the app does not open.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

# No signing for now: there is no certificate, and signing with a self-signed one gives more
# warnings than guarantees.
publish: null
