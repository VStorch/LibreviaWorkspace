name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Linux and Windows are the two target platforms. The .NET sidecar starts a child process and
  # resolves file paths, two things that behave differently on each system and that only a real
  # runner catches.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: npm ci

      - name: Formatação
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Lint (inclui as fronteiras de arquitetura)
        run: npm run lint

      - name: Testes do sidecar (.NET)
        run: npm run sidecar:test

      # Must come before the tests: the end-to-end test talks to the real published binary, the only
      # one that proves both sides of the protocol agree.
      - name: Publicar sidecar
        run: npm run sidecar:build

      - name: Testes
        run: npm test

      # License gate: the build fails if any transitive dependency brings a license outside the
      # allowlist.
      - name: Licenças (npm)
        run: npm run licenses:check

      - name: Licenças (NuGet)
        run: npm run sidecar:licenses

  # End-to-end tests run against the **packaged** app, not `out/`: the only way to prove that
  # resource paths, asar and the sidecar binary are still where the code expects after packaging. A
  # separate job because packaging takes minutes, and `verify` must be fast.
  instalador:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: npm ci

      - name: Empacotar (Linux)
        if: runner.os == 'Linux'
        run: npm run dist

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win

      # Without a display no window starts; `xvfb-run` gives the runner one.
      - name: Ponta a ponta sobre o pacote (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
        env:
          LIBREVIA_E2E_BINARY: release/linux-unpacked/librevia

      - name: Ponta a ponta sobre o pacote (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
        env:
          LIBREVIA_E2E_BINARY: release/win-unpacked/Librevia.exe

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: error

  # The installer needs both binaries, and a single machine publishes them: this job proves cross
  # publishing works.
  publicacao-cruzada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: npm ci

      - name: Publicar para linux-x64 e win-x64
        run: npm run sidecar:build:all

      - name: Conferir que os dois binários saíram
        run: |
          test -x resources/sidecar/linux-x64/Librevia.Format
          test -f resources/sidecar/win-x64/Librevia.Format.exe
