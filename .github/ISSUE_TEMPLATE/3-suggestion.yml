name: Suggestion
description: An idea for a new feature or an improvement.
title: '[suggestion] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: Describe the situation, not just the solution. "I need to number the figures in a report" helps more than "I want an X button".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In Librevia, in Word, in LibreOffice or some other way.
  - type: textarea
    id: idea
    attributes:
      label: How it could work
