name: Bug
description: Something in the application does not work as it should.
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        If the problem is with a specific file, use the **File that opened wrong** template.
        If it is a security flaw, **do not open an issue**: see the [security policy](https://github.com/VStorch/LibreviaWorkspace/blob/main/SECURITY.md).
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new document
        2. Insert a 3 × 3 table
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the text of error messages and screenshots, if any.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Librevia version and system
      placeholder: 'e.g. 0.5.0, Ubuntu 24.04, AppImage'
    validations:
      required: true
